<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D & WebAR Viewer | A-Frame</title>
    
    <!-- Meta tags for SEO & Mobile -->
    <meta name="description" content="Interactive 3D and WebAR model viewer built with A-Frame. Experience high-detail 3D car and asset models in real-time.">
    <meta name="theme-color" content="#0f172a">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome for UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- A-Frame Library (v1.6.0) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <!-- A-Frame Extras for GLTF Animations & Utilities -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v7.5.0/dist/aframe-extras.min.js"></script>

    <!-- A-Frame Orbit Controls Component -->
    <script src="https://unpkg.com/aframe-orbit-controls@1.3.0/dist/aframe-orbit-controls.min.js"></script>

    <style>
        :root {
            --bg-glass: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.15);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --accent-hover: #0284c7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 10px;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-body);
            background-color: #090d16;
            color: var(--text-primary);
        }

        /* Fullscreen A-Frame Canvas */
        a-scene {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay UI Container */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Header Bar */
        .header {
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 12px 20px;
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-color), #818cf8);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .brand-text h1 {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text span {
            font-size: 0.75rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Action Controls Top Right */
        .top-controls {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 15px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        .icon-btn.active {
            background: var(--accent-color);
            color: #090d16;
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Model Switcher Bottom Bar */
        .bottom-panel {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin: 0 auto;
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .model-selector {
            display: flex;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 6px;
            border-radius: var(--radius-lg);
            gap: 6px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            justify-content: center;
        }

        .model-tab {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.88rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .model-tab:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .model-tab.active {
            background: linear-gradient(135deg, var(--accent-color), #6366f1);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* AR Button Special Style */
        .ar-trigger-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
        }

        .ar-trigger-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.6);
        }

        /* Loading Screen Overlay */
        #loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #090d16;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(56, 189, 248, 0.15);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        /* Keyframe Animations */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hide default A-Frame VR/AR button since we have custom UI */
        .a-enter-vr {
            display: none !important;
        }

        @media (max-width: 600px) {
            #ui-container {
                padding: 12px;
            }
            .brand-text h1 {
                font-size: 0.95rem;
            }
            .model-tab {
                padding: 8px 10px;
                font-size: 0.78rem;
            }
            .ar-trigger-btn {
                padding: 10px 22px;
                font-size: 0.88rem;
            }
        }
    </style>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loader-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading 3D Model...</div>
    </div>

    <!-- UI Overlay -->
    <div id="ui-container">
        <!-- Top Header Bar -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div class="brand-text">
                    <h1>WebAR Studio</h1>
                    <span>Powered by A-Frame</span>
                </div>
            </div>

            <div class="top-controls">
                <button class="icon-btn" id="btn-reset" title="Reset View">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button class="icon-btn active" id="btn-rotate" title="Toggle Auto-Rotation">
                    <i class="fa-solid fa-arrows-spin"></i>
                </button>
                <button class="icon-btn" id="btn-light" title="Toggle Lighting Mode">
                    <i class="fa-solid fa-sun"></i>
                </button>
            </div>
        </header>

        <!-- Bottom Model Switcher & AR Launch Button -->
        <div class="bottom-panel">
            <div class="model-selector">
                <button class="model-tab active" data-model="bmw.glb" data-scale="1 1 1" data-pos="0 0 0">
                    <i class="fa-solid fa-car"></i> BMW M3
                </button>
                <button class="model-tab" data-model="f40lm.glb" data-scale="1 1 1" data-pos="0 0 0">
                    <i class="fa-solid fa-car-side"></i> Ferrari F40
                </button>
                <button class="model-tab" data-model="model.glb" data-scale="1 1 1" data-pos="0 0 0">
                    <i class="fa-solid fa-shapes"></i> Asset Model
                </button>
            </div>

            <button class="ar-trigger-btn" id="btn-enter-ar">
                <i class="fa-solid fa-vr-cardboard"></i> View in AR Space
            </button>
        </div>
    </div>

    <!-- A-Frame 3D & WebAR Scene -->
    <a-scene
        embedded
        renderer="colorManagement: true; exposure: 1.2; toneMapping: ACESFilmic; antialias: true;"
        webxr="optionalFeatures: hit-test, local-floor, dom-overlay; overlayElement: #ui-container;"
        vr-mode-ui="enabled: false"
        gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/">

        <!-- Asset Manager -->
        <a-assets id="asset-manager">
            <a-asset-item id="model-bmw" src="bmw.glb"></a-asset-item>
            <a-asset-item id="model-f40" src="f40lm.glb"></a-asset-item>
            <a-asset-item id="model-generic" src="model.glb"></a-asset-item>
        </a-assets>

        <!-- Lighting Setup -->
        <a-entity id="ambient-light" light="type: ambient; color: #ffffff; intensity: 1.5"></a-entity>
        <a-entity id="dir-light-1" light="type: directional; color: #ffffff; intensity: 2; castShadow: true;" position="5 10 7"></a-entity>
        <a-entity id="dir-light-2" light="type: directional; color: #38bdf8; intensity: 0.8;" position="-5 5 -5"></a-entity>
        <a-entity id="dir-light-3" light="type: directional; color: #f43f5e; intensity: 0.5;" position="0 -5 5"></a-entity>

        <!-- Camera & Orbit Controls -->
        <a-entity id="camera-rig" position="0 0 0">
            <a-entity id="main-camera" camera
                look-controls="enabled: false"
                orbit-controls="
                    target: 0 0.5 0;
                    initialPosition: 0 1.5 4;
                    minDistance: 1;
                    maxDistance: 15;
                    enableDamping: true;
                    dampingFactor: 0.12;
                    rotateSpeed: 0.8;
                    zoomSpeed: 1.2;
                    autoRotate: true;
                    autoRotateSpeed: 1.5;
                ">
            </a-entity>
        </a-entity>

        <!-- Main Model Container Pivot -->
        <a-entity id="model-pivot" position="0 0 0" rotation="0 0 0">
            <a-entity id="current-model"
                gltf-model="#model-bmw"
                position="0 0 0"
                scale="1 1 1"
                shadow="cast: true; receive: true">
            </a-entity>
        </a-entity>

        <!-- Ground Grid & Shadow Receiver -->
        <a-grid position="0 0 0" normal-scale="1 1" static-body material="src: null; color: #1e293b; opacity: 0.4; transparent: true"></a-grid>
        <a-plane position="0 -0.01 0" rotation="-90 0 0" width="30" height="30" shadow="receive: true" material="color: #090d16; opacity: 0.8; transparent: true"></a-plane>

    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loaderOverlay = document.getElementById('loader-overlay');
            const sceneEl = document.querySelector('a-scene');
            const modelEntity = document.getElementById('current-model');
            const cameraEntity = document.getElementById('main-camera');
            const modelTabs = document.querySelectorAll('.model-tab');
            const btnReset = document.getElementById('btn-reset');
            const btnRotate = document.getElementById('btn-rotate');
            const btnLight = document.getElementById('btn-light');
            const btnEnterAR = document.getElementById('btn-enter-ar');
            const ambientLight = document.getElementById('ambient-light');

            let autoRotateState = true;
            let brightLightState = true;

            // Hide loader when initial scene is ready & model loaded
            modelEntity.addEventListener('model-loaded', () => {
                loaderOverlay.classList.add('hidden');
            });

            modelEntity.addEventListener('model-error', (e) => {
                console.error('Error loading 3D model:', e.detail);
                loaderOverlay.classList.add('hidden');
                alert('Failed to load model file. Make sure the file exists and is valid GLTF/GLB.');
            });

            // Model Switcher Functionality
            modelTabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    modelTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    const modelFile = tab.getAttribute('data-model');
                    loaderOverlay.classList.remove('hidden');

                    // Map model filename to asset id
                    let assetId = '#model-bmw';
                    if (modelFile.includes('f40lm')) assetId = '#model-f40';
                    else if (modelFile === 'model.glb') assetId = '#model-generic';

                    modelEntity.setAttribute('gltf-model', assetId);
                });
            });

            // Toggle Auto-Rotation
            btnRotate.addEventListener('click', () => {
                autoRotateState = !autoRotateState;
                btnRotate.classList.toggle('active', autoRotateState);
                if (cameraEntity.components['orbit-controls']) {
                    cameraEntity.setAttribute('orbit-controls', 'autoRotate', autoRotateState);
                }
            });

            // Reset Camera Position
            btnReset.addEventListener('click', () => {
                if (cameraEntity.components['orbit-controls']) {
                    cameraEntity.components['orbit-controls'].reset();
                }
            });

            // Toggle Lighting Intensity Mode
            btnLight.addEventListener('click', () => {
                brightLightState = !brightLightState;
                btnLight.classList.toggle('active', brightLightState);
                if (brightLightState) {
                    ambientLight.setAttribute('light', 'intensity', 1.5);
                } else {
                    ambientLight.setAttribute('light', 'intensity', 0.5);
                }
            });

            // WebXR AR Mode Trigger
            btnEnterAR.addEventListener('click', () => {
                if (sceneEl.is('vr-mode') || sceneEl.is('ar-mode')) {
                    sceneEl.exitVR();
                } else {
                    sceneEl.enterVR(); // A-Frame triggers WebXR AR mode when configured
                }
            });

            // Handle WebXR session state UI changes
            sceneEl.addEventListener('enter-vr', () => {
                if (sceneEl.is('ar-mode')) {
                    document.body.classList.add('in-ar-mode');
                }
            });

            sceneEl.addEventListener('exit-vr', () => {
                document.body.classList.remove('in-ar-mode');
            });
        });
    </script>
</body>

</html>
