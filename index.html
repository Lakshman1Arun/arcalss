<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AR Demo</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        model-viewer {
            width: 100%;
            height: 75vh;
            background: white;
        }

        #ar-button {
            margin-top: 20px;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #ar-button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <model-viewer
        id="model"
        src="model.glb"
        alt="3D Model"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">

        <button id="ar-button">
            View in AR
        </button>

    </model-viewer>

    <script>
        const model = document.querySelector("#model");
        const button = document.querySelector("#ar-button");

        button.addEventListener("click", () => {
            model.activateAR();
        });
    </script>

</body>

</html>
